services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - ./.env
    environment:
      FLASK_APP: "app:app"
      FLASK_DEBUG: "1"
      PORT: "5000"
    command: ["flask", "--app", "app:app", "run", "--host=0.0.0.0", "--port=5000", "--debug"]
    volumes:
      - ./:/app
      - ${HOME}/Documents/kozakura/apps_data/flask_template_app:/data
