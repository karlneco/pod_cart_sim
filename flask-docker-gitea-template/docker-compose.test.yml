services:
  web:
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  smoke-test:
    profiles: ["test"]
    build: .
    depends_on:
      web:
        condition: service_healthy
    command: ["python", "scripts/docker_smoke_check.py", "--base-url", "http://web:5000"]
