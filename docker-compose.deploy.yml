services:
  app:
    image: pod-cart-sim:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
    env_file:
      - ./.env
    environment:
      PORT: "5002"
      PRODUCT_FILE: /data/products.json
    volumes:
      - ${APP_DATA_DIR:-/srv/apps_data/pod_cart_sim}:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5002/healthz', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
